# One-click hosting on Render.com (free plan). Render reads this file automatically.
services:
  - type: web
    name: unigenius-ai
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm install --include=dev --prefix client && npm install --prefix server && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: GEMINI_API_KEY
        sync: false   # Render asks you to paste your key; it is never stored in the code
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_FALLBACK_MODELS
        value: gemini-3.8-flash,gemini-2.5-flash-lite
